name: Update Development Projects Data

on:
  schedule:
    # Run daily at 6 AM UTC (2 AM EDT / 1 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Exits non-zero if any source fails, turning the run red so
    # failures get noticed. Successful sources still update the
    # database, and the steps below still commit their data.
    - name: Update projects database
      run: python -m data_collection.update_database

    - name: Export GeoJSON
      if: always()
      run: python scripts/export_geojson.py

    - name: Generate run summary
      if: always()
      run: python scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY

    - name: Commit and push changes
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/projects.db data/projects.geojson

        # Only commit if there are changes
        if ! git diff --cached --quiet; then
          COMMIT_MSG=$(python scripts/generate_commit_message.py 2>/dev/null || echo "Automated data update")
          git commit -m "🤖 ${COMMIT_MSG}"
          git push
        else
          echo "No data changes to commit"
        fi
